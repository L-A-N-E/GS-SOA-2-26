services:
  postgres:
    image: postgres:16-alpine
    container_name: sbp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbp
      POSTGRES_USER: sbp
      POSTGRES_PASSWORD: sbp
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - sbp-dados:/var/lib/postgresql/data
    healthcheck:
      # A aplicacao so deve tentar migrar depois que o banco aceitar conexoes.
      test: ["CMD-SHELL", "pg_isready -U sbp -d sbp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servico opcional: sobe a propria API em container, para quem preferir nao
  # rodar o Maven na maquina. Fica atras de um profile, de modo que o
  # "docker compose up -d" do README continue subindo apenas o banco.
  #
  #   docker compose --profile app up -d --build
  api:
    build: .
    container_name: sbp-api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SBP_DB_URL: jdbc:postgresql://postgres:5432/sbp
      SBP_DB_USER: sbp
      SBP_DB_PASSWORD: sbp
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sbp-dados:
